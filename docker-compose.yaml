services:
  # =========================================
  # SERVICE 1: API SERVER (Dashboard Backend)
  # =========================================
  api-server:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - SERVICE_NAME=server
        - NODE_ENV=production
    image: dimabot/api-server:latest
    container_name: dima-server
    command: node dist/server/index.js
    restart: always
    env_file: .env
    networks:
      - web-proxy
      - databases

  # =========================================
  # SERVICE 2: CHAT BOT (Twitch Connection)
  # =========================================
  chat-bot:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - SERVICE_NAME=bot
        - NODE_ENV=production
    image: dimabot/chat-bot:latest
    container_name: dima-bot
    command: node dist/bot/index.js
    restart: always
    env_file: .env
    networks:
      - web-proxy
      - databases

  # =========================================
  # SERVICE 3: CRON WORKERS (Host Process)
  # =========================================
  dima-cron:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - SERVICE_NAME=cron
        - NODE_ENV=production
    container_name: dima-cron
    command: node dist/workers/cron.index.js
    restart: always
    env_file: .env
    stop_grace_period: 30s
    networks:
      - web-proxy
      - databases

networks:
  web-proxy:
    external: true
  databases:
    external: true
