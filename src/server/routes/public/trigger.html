<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triggers</title>
    <style>
        #triggerContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 600px;
            height: 1000px;
        }
    </style>
</head>
<body>
    <div class="triggerContainer" id="triggerContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script>
        const channelID = window.location.pathname.split('/')[3];
        const searchParams = new URLSearchParams(window.location.search);
        const isPreview = searchParams.get('preview') === '1';
        const triggerContainer = document.getElementById('triggerContainer');

        let triggerCount = 0;
        let socket = null;
        let heartbeatIntervalId = null;

        function renderTrigger(data) {
            triggerCount++;
            const { mediaType, url, volume } = data || {};

            if (!mediaType || !url) {
                return;
            }

            const triggerType = mediaType.split('/')[0];
            if (triggerType === 'video') {
                triggerContainer.appendChild(createVideoPlayer(url, mediaType, volume));
                return;
            }

            if (triggerType === 'audio') {
                document.body.appendChild(createAudioPlayer(url, mediaType, volume));
            }
        }

        function cleanupSocket() {
            if (heartbeatIntervalId !== null) {
                window.clearInterval(heartbeatIntervalId);
                heartbeatIntervalId = null;
            }

            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }

        if (!isPreview) {
            socket = io(`/overlays/triggers/${channelID}`, {
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000
            });

            heartbeatIntervalId = window.setInterval(() => {
                socket.emit('ping', { channelID });
            }, 1000);

            socket.on('connect_error', (error) => {
                console.log('Error:', error);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'trigger-overlay-error',
                        message: error?.message || 'Failed to connect to trigger websocket'
                    }, '*');
                }
            });

            socket.on('connect', () => {
                console.log('Connected to triggers');
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'trigger-overlay-connected',
                        channelID
                    }, '*');
                }
            });

            socket.on('disconnect', (reason) => {
                console.log('Disconnected from triggers:', reason);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'trigger-overlay-error',
                        message: `Trigger overlay disconnected: ${reason}`
                    }, '*');
                }
            });

            socket.io.on('reconnect_attempt', (attempt) => {
                console.log('Trigger reconnect attempt:', attempt);
            });

            socket.io.on('reconnect', (attempt) => {
                console.log('Trigger reconnected:', attempt);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'trigger-overlay-connected',
                        channelID
                    }, '*');
                }
            });

            socket.on('error', (error) => {
                console.log({error});
                console.log('Error:', error);
            });

            socket.on('trigger', renderTrigger);
            window.addEventListener('beforeunload', cleanupSocket);
        }

        window.addEventListener('message', (event) => {
            if (!isPreview || !event.data || event.data.type !== 'trigger-preview') {
                return;
            }

            renderTrigger(event.data.payload);
        });

        function createVideoPlayer(url, mediaType, volume) {
            const videoPlayer = document.createElement('video');
            videoPlayer.style.position = 'fixed';
            videoPlayer.style.top = '0px';
            videoPlayer.style.left = '0px';
            videoPlayer.setAttribute('width', '1000px');
            videoPlayer.setAttribute('autoplay', 'true');
            videoPlayer.setAttribute('playsinline', 'true');
            videoPlayer.setAttribute('id', String(triggerCount));
            videoPlayer.volume = Number.isFinite(volume) ? (volume / 100) : 1;
            videoPlayer.src = url;
            videoPlayer.type = mediaType;

            videoPlayer.addEventListener('ended', () => {
                videoPlayer.remove();
            });

            videoPlayer.addEventListener('error', () => {
                console.log('Error playing trigger video', { url, mediaType });
                videoPlayer.remove();
            });

            return videoPlayer;
        }

        function createAudioPlayer(url, mediaType, volume) {
            const audioPlayer = document.createElement('audio');
            audioPlayer.setAttribute('autoplay', 'true');
            audioPlayer.setAttribute('id', String(triggerCount));
            audioPlayer.volume = Number.isFinite(volume) ? (volume / 100) : 1;
            audioPlayer.src = url;
            audioPlayer.type = mediaType;

            audioPlayer.addEventListener('ended', () => {
                audioPlayer.remove();
            });

            audioPlayer.addEventListener('error', () => {
                console.log('Error playing trigger audio', { url, mediaType });
                audioPlayer.remove();
            });

            return audioPlayer;
        }
    </script>
</body>
</html>
